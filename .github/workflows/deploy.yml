name: Deploy to Shopify Oxygen

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: oxygen-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Storefront to Oxygen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Code
        run: npm run typecheck

      - name: Deploy to Oxygen
        if: env.SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN != ''
        run: npx shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN }}

      - name: Missing Deployment Token Notice
        if: env.SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN == ''
        run: |
          echo "::warning::SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN secret is not set in GitHub repository settings. Skipping deployment to Oxygen."
          echo "To enable automatic deployments, add SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN in your repo settings."
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN }}
